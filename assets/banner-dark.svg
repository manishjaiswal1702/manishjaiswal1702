<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-violet-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <linearGradient id="card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#1F242C"/>
    </linearGradient>

    <!-- Avatar clip -->
    <clipPath id="avatar-clip">
      <rect x="42" y="72" width="186" height="186" rx="14" ry="14"/>
    </clipPath>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes border-glow-anim {
      0%, 100% { stroke-opacity: 0.8; }
      50% { stroke-opacity: 0.3; }
    }
    .cursor { animation: cursor-blink 1.1s infinite; }
    .status-dot { animation: pulse 2s infinite ease-in-out; }
    .portrait-border { animation: border-glow-anim 4s infinite ease-in-out; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Banner Outer Card -->
  <rect x="1" y="1" width="848" height="318" rx="16" fill="url(#bg-grad)" stroke="url(#card-stroke)" stroke-width="1.5"/>

  <!-- Background Cyber Glows -->
  <circle cx="90" cy="80" r="140" fill="#00F0FF" opacity="0.04" filter="url(#glow)"/>
  <circle cx="750" cy="240" r="160" fill="#A855F7" opacity="0.05" filter="url(#glow)"/>
  <circle cx="480" cy="60" r="120" fill="#00F5D4" opacity="0.03" filter="url(#glow)"/>

  <!-- Terminal Window Header Bar -->
  <rect x="1" y="1" width="848" height="42" rx="16" fill="#161B22" fill-opacity="0.6"/>
  <rect x="1" y="24" width="848" height="18" fill="#161B22" fill-opacity="0.6"/>
  <line x1="1" y1="42" x2="849" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="28" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="46" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Terminal Title -->
  <text x="425" y="26" text-anchor="middle" fill="#8B949E" font-size="12" class="font-mono" letter-spacing="0.5">
    manishjaiswal1702@kiet-ai:~ $ ./portfolio-init.sh --profile
  </text>

  <!-- LEFT: Pixel Portrait Section -->
  <!-- Ambient glow behind portrait -->
  <rect x="36" y="66" width="198" height="198" rx="18" fill="url(#border-glow)" opacity="0.15" filter="url(#subtle-glow)"/>
  
  <!-- Outer glowing border -->
  <rect class="portrait-border" x="39" y="69" width="192" height="192" rx="16" fill="#0A0E17" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Corner HUD Accents -->
  <path d="M 36 82 L 36 66 L 52 66" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
  <path d="M 218 66 L 234 66 L 234 82" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
  <path d="M 36 248 L 36 264 L 52 264" stroke="#A855F7" stroke-width="2.5" fill="none"/>
  <path d="M 218 264 L 234 264 L 234 248" stroke="#A855F7" stroke-width="2.5" fill="none"/>

  <!-- Dithered / Pixel-Art Portrait Image -->
  <image href="data:image/png;base64," x="42" y="72" width="186" height="186" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Cyber scanline overlay on portrait -->
  <line x1="42" y1="72" x2="228" y2="72" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="258" x2="228" y2="258" stroke="#00F5D4" stroke-width="1" opacity="0.4"/>

  <!-- Status pill under portrait -->
  <rect x="44" y="274" width="182" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="58" cy="287" r="4.5" fill="#00F5D4" class="status-dot"/>
  <text x="70" y="291" fill="#E6EDF3" font-size="10.5" font-weight="600" class="font-mono" letter-spacing="0.5">READY TO DEPLOY</text>
  <text x="180" y="291" fill="#8B949E" font-size="10" class="font-mono">⚡ '27</text>

  <!-- RIGHT: Profile Details Section -->
  <!-- Name -->
  <text x="268" y="98" fill="url(#cyan-violet-text)" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.5">
    Manish Kumar Jaiswal
  </text>

  <!-- Role Badge Container -->
  <rect x="268" y="112" width="375" height="26" rx="6" fill="#1F1A2F" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="278" y="129" fill="#C084FC" font-size="12" font-weight="600" class="font-mono">
    ⚡ Full Stack Developer &bull; AI &amp; Cloud Engineer
  </text>

  <!-- Education Line -->
  <g transform="translate(268, 154)">
    <circle cx="6" cy="6" r="3" fill="#00F0FF"/>
    <text x="18" y="10" fill="#E6EDF3" font-size="13" font-weight="600" class="font-sans">
      B.Tech CSE (AI) &bull; KIET Group of Institutions
    </text>
    <rect x="340" y="-3" width="70" height="20" rx="10" fill="#162A2B" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="375" y="11" fill="#00F5D4" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">2027</text>
  </g>

  <!-- Tech Stack Terminal Block -->
  <g transform="translate(268, 182)">
    <rect x="0" y="0" width="545" height="54" rx="8" fill="#111622" stroke="#262C3A" stroke-width="1"/>
    <text x="14" y="22" fill="#8B949E" font-size="11" font-weight="600" class="font-mono">
      <tspan fill="#00F0FF">&gt; CORE_STACK:</tspan>
    </text>

    <!-- Capsule Badges for Core Stack -->
    <!-- MERN Stack -->
    <rect x="112" y="9" width="86" height="20" rx="4" fill="#161B22" stroke="#30363D"/>
    <text x="155" y="23" fill="#61DAFB" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">MERN Stack</text>

    <!-- LangChain -->
    <rect x="204" y="9" width="78" height="20" rx="4" fill="#161B22" stroke="#30363D"/>
    <text x="243" y="23" fill="#00F5D4" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">LangChain</text>

    <!-- LangGraph -->
    <rect x="288" y="9" width="80" height="20" rx="4" fill="#161B22" stroke="#30363D"/>
    <text x="328" y="23" fill="#A855F7" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">LangGraph</text>

    <!-- Kubernetes -->
    <rect x="374" y="9" width="84" height="20" rx="4" fill="#161B22" stroke="#30363D"/>
    <text x="416" y="23" fill="#326CE5" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">Kubernetes</text>

    <!-- AWS -->
    <rect x="464" y="9" width="50" height="20" rx="4" fill="#161B22" stroke="#30363D"/>
    <text x="489" y="23" fill="#FF9900" font-size="10.5" font-weight="700" text-anchor="middle" class="font-mono">AWS</text>

    <!-- Subtext inside block -->
    <text x="14" y="42" fill="#8B949E" font-size="11" class="font-mono">
      <tspan fill="#00F5D4">&gt; ARCH:</tspan> Microservices &bull; Distributed Sandboxes &bull; RAG Agents<tspan class="cursor" fill="#00F0FF">_</tspan>
    </text>
  </g>

  <!-- Certification Badge Container -->
  <g transform="translate(268, 252)">
    <rect x="0" y="0" width="370" height="34" rx="8" fill="#15241C" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Shield / Cloud Icon -->
    <path d="M 18 17 L 24 11 L 30 17 L 24 23 Z" fill="#00F5D4"/>
    <text x="38" y="22" fill="#E6EDF3" font-size="12.5" font-weight="700" class="font-sans">
      ☁️ AWS Certified Cloud Practitioner
    </text>
    <rect x="290" y="7" width="68" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
    <text x="324" y="21" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">VERIFIED</text>
  </g>

  <!-- LeetCode/DSA Stat Badge -->
  <g transform="translate(650, 252)">
    <rect x="0" y="0" width="163" height="34" rx="8" fill="#1F1C16" stroke="#FFA116" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="14" y="22" fill="#FFA116" font-size="12" font-weight="700" class="font-mono">
      320+ DSA Solved
    </text>
  </g>
</svg>
