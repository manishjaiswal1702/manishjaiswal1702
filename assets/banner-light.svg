<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="border-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Avatar clip -->
    <clipPath id="avatar-clip-light">
      <rect x="42" y="72" width="186" height="186" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulse-light {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes cursor-blink-light {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-light { animation: cursor-blink-light 1.1s infinite; }
    .status-dot-light { animation: pulse-light 2s infinite ease-in-out; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Banner Outer Card -->
  <rect x="1" y="1" width="848" height="318" rx="16" fill="url(#bg-grad-light)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Terminal Window Header Bar -->
  <rect x="1" y="1" width="848" height="42" rx="16" fill="#E2E8F0" fill-opacity="0.8"/>
  <rect x="1" y="24" width="848" height="18" fill="#E2E8F0" fill-opacity="0.8"/>
  <line x1="1" y1="42" x2="849" y2="42" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="28" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="46" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Terminal Title -->
  <text x="425" y="26" text-anchor="middle" fill="#475569" font-size="12" class="font-mono" letter-spacing="0.5">
    manishjaiswal1702@kiet-ai:~ $ ./portfolio-init.sh --profile
  </text>

  <!-- LEFT: Pixel Portrait Section -->
  <rect x="39" y="69" width="192" height="192" rx="16" fill="#FFFFFF" stroke="url(#border-grad-light)" stroke-width="2"/>

  <!-- Corner HUD Accents -->
  <path d="M 36 82 L 36 66 L 52 66" stroke="#0284C7" stroke-width="2.5" fill="none"/>
  <path d="M 218 66 L 234 66 L 234 82" stroke="#0284C7" stroke-width="2.5" fill="none"/>
  <path d="M 36 248 L 36 264 L 52 264" stroke="#7C3AED" stroke-width="2.5" fill="none"/>
  <path d="M 218 264 L 234 264 L 234 248" stroke="#7C3AED" stroke-width="2.5" fill="none"/>

  <!-- Dithered / Pixel-Art Portrait Image -->
  <image href="data:image/png;base64," x="42" y="72" width="186" height="186" clip-path="url(#avatar-clip-light)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Status pill under portrait -->
  <rect x="44" y="274" width="182" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="58" cy="287" r="4.5" fill="#059669" class="status-dot-light"/>
  <text x="70" y="291" fill="#1E293B" font-size="10.5" font-weight="600" class="font-mono" letter-spacing="0.5">READY TO DEPLOY</text>
  <text x="180" y="291" fill="#64748B" font-size="10" class="font-mono">&#9889; '27</text>

  <!-- RIGHT: Profile Details Section -->
  <!-- Name -->
  <text x="268" y="98" fill="url(#title-grad-light)" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.5">
    Manish Kumar Jaiswal
  </text>

  <!-- Role Badge Container -->
  <rect x="268" y="112" width="375" height="26" rx="6" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1"/>
  <text x="278" y="129" fill="#6D28D9" font-size="12" font-weight="600" class="font-mono">
    &#9889; Full Stack Developer &#8226; AI &amp; Cloud Engineer
  </text>

  <!-- Education Line -->
  <g transform="translate(268, 154)">
    <circle cx="6" cy="6" r="3" fill="#0284C7"/>
    <text x="18" y="10" fill="#1E293B" font-size="13" font-weight="600" class="font-sans">
      B.Tech CSE (AI) &#8226; KIET Group of Institutions
    </text>
    <rect x="340" y="-3" width="70" height="20" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1"/>
    <text x="375" y="11" fill="#0F766E" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">2027</text>
  </g>

  <!-- Tech Stack Terminal Block -->
  <g transform="translate(268, 182)">
    <rect x="0" y="0" width="545" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="22" fill="#475569" font-size="11" font-weight="600" class="font-mono">
      <tspan fill="#0284C7">&gt; CORE_STACK:</tspan>
    </text>

    <!-- Capsule Badges for Core Stack -->
    <!-- MERN Stack -->
    <rect x="112" y="9" width="86" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="155" y="23" fill="#0284C7" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">MERN Stack</text>

    <!-- LangChain -->
    <rect x="204" y="9" width="78" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="243" y="23" fill="#0F766E" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">LangChain</text>

    <!-- LangGraph -->
    <rect x="288" y="9" width="80" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="328" y="23" fill="#6D28D9" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">LangGraph</text>

    <!-- Kubernetes -->
    <rect x="374" y="9" width="84" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="416" y="23" fill="#2563EB" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">Kubernetes</text>

    <!-- AWS -->
    <rect x="464" y="9" width="50" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="489" y="23" fill="#D97706" font-size="10.5" font-weight="700" text-anchor="middle" class="font-mono">AWS</text>

    <!-- Subtext inside block -->
    <text x="14" y="42" fill="#64748B" font-size="11" class="font-mono">
      <tspan fill="#059669">&gt; ARCH:</tspan> Microservices &#8226; Distributed Sandboxes &#8226; RAG Agents<tspan class="cursor-light" fill="#0284C7">_</tspan>
    </text>
  </g>

  <!-- Certification Badge Container -->
  <g transform="translate(268, 252)">
    <rect x="0" y="0" width="370" height="34" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <path d="M 18 17 L 24 11 L 30 17 L 24 23 Z" fill="#059669"/>
    <text x="38" y="22" fill="#065F46" font-size="12.5" font-weight="700" class="font-sans">
      &#9729;&#65039; AWS Certified Cloud Practitioner
    </text>
    <rect x="290" y="7" width="68" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
    <text x="324" y="21" fill="#047857" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">VERIFIED</text>
  </g>

  <!-- LeetCode/DSA Stat Badge -->
  <g transform="translate(650, 252)">
    <rect x="0" y="0" width="163" height="34" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="14" y="22" fill="#B45309" font-size="12" font-weight="700" class="font-mono">
      320+ DSA Solved
    </text>
  </g>
</svg>
